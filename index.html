<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organiza+ Rotina Acadêmica — protótipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#EFFAFC;--card:#fff;--ink:#0C3140;--mute:#4A6B75;--line:#D0EBF0;--brand:#0B7C96;--on:#fff;--accent:#22D3EE;--soft:#DDF5F9;--aqua:#A5F3FC;--mint:#99F6E4;--sky:#BAE6FD;--bad:#C2410C;--ok:#0F766E;
--side:#0B3B47;--side2:#0A2F3A;--sidetx:#A8D5DF;--dot:#C3E8EF;--hero:linear-gradient(160deg,#E6FCFF 0%,#A5F3FC 48%,#99F6E4 100%);--herotx:#0C3140;--ringbg:rgba(11,124,150,.16);--ringfg:#0B7C96;
--fd:"Bricolage Grotesque",Figtree,system-ui,sans-serif;--sh:0 1px 2px rgba(11,59,71,.06),0 6px 18px -8px rgba(11,59,71,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071C23;--card:#0D2C36;--ink:#E3F6F9;--mute:#93BAC4;--line:#1C4552;--brand:#22D3EE;--on:#05222A;--soft:#123F4B;--aqua:#155E75;--mint:#115E59;--sky:#0C4A6E;--bad:#FB923C;--ok:#5EEAD4;--side:#082A33;--side2:#061F27;--sidetx:#9CC9D3;--dot:#10323C;--hero:linear-gradient(160deg,#0E4F5E 0%,#0B6F86 55%,#0F766E 100%);--herotx:#EFFCFF;--ringbg:rgba(165,243,252,.2);--ringfg:#A5F3FC;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#071C23;--card:#0D2C36;--ink:#E3F6F9;--mute:#93BAC4;--line:#1C4552;--brand:#22D3EE;--on:#05222A;--soft:#123F4B;--aqua:#155E75;--mint:#115E59;--sky:#0C4A6E;--bad:#FB923C;--ok:#5EEAD4;--side:#082A33;--side2:#061F27;--sidetx:#9CC9D3;--dot:#10323C;--hero:linear-gradient(160deg,#0E4F5E 0%,#0B6F86 55%,#0F766E 100%);--herotx:#EFFCFF;--ringbg:rgba(165,243,252,.2);--ringfg:#A5F3FC;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px;color:var(--ink);font:400 15px/1.5 Figtree,system-ui,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,.logo,.clock,.stat b{font-family:var(--fd)}
h1{font-size:30px;font-weight:800;letter-spacing:-.8px;margin:0 0 4px;line-height:1.12}h2{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:0 0 12px}
h3.h{font-size:14px;margin:18px 0 6px}
.sub{color:var(--mute);margin:0 0 18px}
/* auth */
.auth{--abg:#F3F9FB;--teal:#0E8C88;--tealbtn:#0B817E;--tealsoft:#D7F3EF;--blue:#3B82F6;--bluesoft:#DDEBFD;--vio:#8B5CF6;--viosoft:#ECE5FD;--ibg:#fff;display:grid;grid-template-columns:1.12fr 1fr;min-height:100vh;background:var(--abg)}
:root[data-theme="dark"] .auth{--abg:#071C23;--teal:#2DD4BF;--tealbtn:#2DD4BF;--tealsoft:#0F3F46;--blue:#60A5FA;--bluesoft:#12354F;--vio:#A78BFA;--viosoft:#2A2552;--ibg:#0A2630}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .auth{--abg:#071C23;--teal:#2DD4BF;--tealbtn:#2DD4BF;--tealsoft:#0F3F46;--blue:#60A5FA;--bluesoft:#12354F;--vio:#A78BFA;--viosoft:#2A2552;--ibg:#0A2630}}
.auth .logo{font-size:40px;padding:0;color:var(--ink);letter-spacing:-1.2px}.auth .logo b{color:var(--teal)}
.auth .logo small{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:6px;opacity:.85}
.hero{position:relative;overflow:hidden;padding:64px 56px 40px;display:flex;flex-direction:column;justify-content:center;background:var(--abg);color:var(--ink)}
.hero>*{position:relative;z-index:1}
.bl{position:absolute;pointer-events:none;z-index:0}
.bl1{left:-70px;top:-70px;width:210px;height:210px;background:#7FCFC3;opacity:.6;border-radius:30% 70% 70% 30%/30% 30% 70% 70%}
.bl2{right:-50px;bottom:-70px;width:250px;height:250px;background:#6CC6B9;opacity:.65;border-radius:60% 40% 30% 70%/60% 30% 70% 40%}
.bl3{left:-100px;bottom:-90px;width:300px;height:300px;background:#C4D8F7;opacity:.55;border-radius:50% 50% 60% 40%/50% 60% 40% 50%}
:root[data-theme="dark"] .bl{opacity:.18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bl{opacity:.18}}
.ill{position:absolute;right:40px;top:22px;width:224px;z-index:1;pointer-events:none}
.ah{font-size:clamp(32px,3.5vw,46px);font-weight:800;letter-spacing:-1.2px;line-height:1.12;margin:34px 0 18px;max-width:520px}
.ah span{display:block;color:var(--teal);font-size:1.1em}
.hero .lead{margin:0 0 28px;max-width:430px;color:var(--mute);font-size:16px;line-height:1.65}
.lcs{display:grid;gap:14px;max-width:780px}
.lc{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:14px;padding:12px 18px 12px 0;box-shadow:0 1px 2px rgba(11,59,71,.05),0 10px 26px -14px rgba(11,59,71,.22);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.lc:before{content:"";align-self:stretch;width:5px;border-radius:0 4px 4px 0;background:var(--c);flex:none;margin:-12px 0 -12px 0}
.lci{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--c);margin-left:2px}
.lc div:not(.lci){flex:1;min-width:0}.lc b{display:block;font-size:15.5px}.lc small{display:block;color:var(--mute);font-size:13.5px}
.lc .pill{flex:none;background:var(--tealsoft);color:var(--teal);font-weight:700;font-size:13px;padding:4px 16px;border-radius:99px}
.lc .chev{flex:none;color:var(--mute);opacity:.7}
.lc.c1{--c:var(--teal);--cs:var(--tealsoft)}.lc.c2{--c:var(--blue);--cs:var(--bluesoft)}.lc.c3{--c:var(--vio);--cs:var(--viosoft)}
.foot{display:flex;align-items:center;gap:12px;margin-top:34px;color:var(--mute);font-size:12px;letter-spacing:1.4px;opacity:.85}
.foot:before{content:"";width:40px;height:1px;background:currentColor;opacity:.6}
.foot i{width:3px;height:3px;border-radius:50%;background:currentColor;display:inline-block}
.boxw{background:var(--card);display:flex;align-items:center;justify-content:center;padding:40px 48px}
.box{max-width:560px;width:100%}
.auth .box .logo{font-size:34px}
.auth .box .logo small{font-size:14px}
.wel{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0 0 8px;line-height:1.1}.wels{margin:0 0 24px;font-size:16px;max-width:460px}
.tabs{display:flex;gap:14px;background:none;padding:0;margin-bottom:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);padding:0;height:50px;border-radius:12px;font-weight:700;color:var(--mute);cursor:pointer;font-size:15px}
.tabs button[aria-selected=true]{background:var(--tealbtn);color:var(--on);border-color:transparent;box-shadow:0 8px 18px -10px var(--tealbtn)}
.fld{position:relative}.fld>svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.fld input{padding:0 46px 0 48px;height:54px;border-radius:12px;background:var(--ibg);font-size:15px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:10px;display:grid;place-items:center}
.eye:hover{background:var(--soft)}
.auth .btn.full{background:var(--tealbtn);height:54px;border-radius:12px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;box-shadow:0 12px 22px -14px var(--tealbtn)}
.auth .btn.ghost.full{background:transparent;color:var(--tealbtn);border:1.5px solid color-mix(in srgb,var(--tealbtn) 45%,var(--line));font-size:15px;height:50px;box-shadow:none;margin-top:14px}
.auth .btn.ghost.full:hover{background:var(--tealsoft);filter:none}
.auth .note{margin-top:20px;font-size:13px}
.err{color:var(--bad);font-weight:600;min-height:22px;margin:8px 0 0}
.auth .err{min-height:18px;margin:4px 0 0}
@media(max-width:1180px){.ill{display:none}}

/* app */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,var(--side),var(--side2));padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:24px;padding:0 10px 18px;letter-spacing:-.6px;line-height:1.1}.logo b{color:var(--accent)}
.logo small{display:block;font-family:Figtree,system-ui,sans-serif;font-size:11.5px;font-weight:700;color:var(--mute);letter-spacing:.2px;margin-top:4px}
nav .logo{color:#F1FDFF}nav .logo small{color:var(--sidetx)}
.hero .logo b{color:var(--brand)}.hero .logo small{color:var(--herotx);opacity:.8;font-size:13px}
nav .nb{all:unset;cursor:pointer;padding:10px 14px;border-radius:10px;font-weight:500;color:var(--sidetx);position:relative;transition:background .15s,color .15s}
nav .nb[aria-current=page]{background:rgba(34,211,238,.16);color:#CFFAFE;font-weight:700}
nav .nb[aria-current=page]:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
nav .nb:hover{background:rgba(255,255,255,.07);color:#fff}
nav .nb:focus-visible{outline:3px solid var(--accent)}
.me{margin-top:auto;padding:12px;border-radius:12px;background:rgba(165,243,252,.12);color:var(--sidetx);font-size:13px}.me b{display:block;font-size:14px;color:#F1FDFF;overflow-wrap:anywhere}
main{padding:30px 28px;max-width:1040px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;transition:filter .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.1)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--soft);filter:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.full{width:100%;margin-top:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.2fr 1fr}.g2e{grid-template-columns:1fr 1.25fr;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.welcome{display:flex;gap:22px;align-items:center;background:linear-gradient(120deg,#DFFAFF 0%,#A5F3FC 55%,#99F6E4 115%);color:#0C3140;border:0;margin-bottom:16px;position:relative;overflow:hidden}
.welcome:after{content:"";position:absolute;width:220px;height:220px;right:-60px;top:-90px;border-radius:50%;border:30px solid rgba(255,255,255,.4);pointer-events:none}
.welcome>*{position:relative;z-index:1}
:root[data-theme="dark"] .welcome{background:linear-gradient(120deg,#0E4F5E,#0B6F86 60%,#0F766E);color:#EFFCFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .welcome{background:linear-gradient(120deg,#0E4F5E,#0B6F86 60%,#0F766E);color:#EFFCFF}}
.welcome h1{font-size:27px}.welcome p{margin:0;opacity:.9}
.stat{position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--accent),var(--mint))}
.stat b{display:block;font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;color:var(--brand)}.stat span{color:var(--mute);font-size:13px}
.item{display:flex;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0}
.bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
.item .t{all:unset;cursor:pointer;flex:1 1 170px;min-width:0}.item .t strong{display:block;overflow-wrap:anywhere}.item small{color:var(--mute)}
.item .t:focus-visible{outline:3px solid var(--accent)}
.done strong{text-decoration:line-through;color:var(--mute)}
.chk{width:22px;height:22px;accent-color:var(--brand);flex:none;cursor:pointer}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--aqua);color:#0C4A5A;white-space:nowrap}
:root[data-theme="dark"] .tag{color:#E3F6F9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#E3F6F9}}
.tag.Alta{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.late{color:var(--bad);font-weight:700}
.prog{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;border-radius:99px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters>*{flex:1 1 150px}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);outline:0}
textarea{resize:vertical;min-height:70px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;color:var(--mute);font-size:12px;font-weight:700;padding:4px 0}
.day{all:unset;box-sizing:border-box;cursor:pointer;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);transition:background .15s}
.day:hover{background:var(--soft)}
.day:focus-visible{outline:3px solid var(--accent)}
.day.sel{border-color:var(--brand);background:var(--aqua);color:#0C3140}.day.today b{color:var(--brand);background:var(--aqua);border-radius:6px;padding:0 5px;align-self:flex-start}
.day.sel.today b{background:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{color:var(--mute);padding:10px 0;margin:0}
.dcard{border-left:6px solid;display:flex;justify-content:space-between;gap:12px;align-items:center}
.dcard small{color:var(--mute);display:block}
/* materiais */
.drop{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;cursor:pointer;width:100%;border:2px dashed var(--accent);border-radius:16px;padding:24px;background:linear-gradient(135deg,var(--soft),color-mix(in srgb,var(--mint) 35%,var(--soft)));margin-bottom:14px;transition:background .15s}
.drop b{color:var(--brand);font-size:17px;font-family:var(--fd)}.drop span{color:var(--mute)}
.drop.over,.drop:hover{background:linear-gradient(135deg,var(--aqua),var(--mint))}
.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mrow{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mrow:first-child{border-top:0}
.badge{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--soft);color:var(--brand);border-bottom:4px solid}
.mi{flex:1 1 220px;min-width:0}.mi strong{display:block;overflow-wrap:anywhere}.mi small{color:var(--mute);display:block}
.macts{display:flex;gap:8px;flex-wrap:wrap}.macts .btn{padding:7px 12px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin:10px 0 0;font:inherit}
.pv{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;object-fit:contain;background:var(--soft);margin-top:10px}
/* estudar */
.dial{--p:0;position:relative;width:196px;height:196px;border-radius:50%;margin:14px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0);box-shadow:0 0 0 1px var(--line)}
.dial:before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card);box-shadow:inset 0 2px 8px rgba(11,59,71,.08)}
.clock{position:relative;font-size:44px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--brand);line-height:1.1}
#tmcard .btns{justify-content:center}
#tmcard .note{text-align:center}
details{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:4px}summary{cursor:pointer;font-weight:700;color:var(--brand)}
.qa{padding:10px 0;border-top:1px solid var(--line)}.qa p{margin:0 0 4px}
.sum{margin:0;padding-left:20px}.sum li{margin-bottom:6px}
.chart{display:grid;gap:8px}.chart div{display:grid;grid-template-columns:minmax(80px,1fr) 2fr 52px;gap:10px;align-items:center;font-size:14px}
.chart i{display:block;height:10px;border-radius:99px}
.g2p{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start}
.rgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px;align-items:start}
.side{display:grid;gap:16px}
.reader{padding:12px;max-height:calc(100vh - 150px);overflow:auto;background:var(--soft)}
.reader .pv{height:calc(100vh - 190px);min-height:380px;margin-top:0}
.pages{display:grid;gap:10px;justify-items:center}
.pg{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25);max-width:100%}
.doc{line-height:1.6;max-width:72ch;margin:0 auto;padding:14px 16px;background:var(--card);border-radius:10px}.doc h4{margin:18px 0 6px;font-size:15px;color:var(--brand);font-family:var(--fd)}.doc p{margin:0 0 9px;overflow-wrap:anywhere}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{border-left:6px solid;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.pcard small{color:var(--mute)}.pcard strong{overflow-wrap:anywhere}
dialog{border:1px solid var(--line);border-radius:18px;padding:22px;width:min(460px,92vw);background:var(--card);color:var(--ink);max-height:92vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(7,40,50,.5)}
dialog.wide{width:min(760px,94vw)}
dialog::backdrop{background:rgba(5,32,41,.55)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw input{appearance:none;width:30px;height:30px;border-radius:50%;padding:0;border:3px solid transparent;cursor:pointer;background:var(--c)}
.sw input:checked{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:#E6FBFF;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;max-width:90vw;box-shadow:0 8px 24px -8px rgba(5,32,41,.5)}
.note{font-size:12px;color:var(--mute);margin-top:16px}


nav .tgl{display:flex;align-items:center;gap:10px;margin-top:auto}nav .tgl+.me{margin-top:8px}
.tgf{position:absolute;top:18px;right:20px;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-weight:600;font-size:13.5px;cursor:pointer}
.tgf:hover{background:var(--soft);color:var(--brand)}
.boxw{position:relative}
:root[data-theme="dark"] .day.sel{color:#E3F6F9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day.sel{color:#E3F6F9}}
@media(max-width:760px){
.tgf span{display:none}.tgf{padding:0 12px}nav .tgl{margin-top:0}nav .tgl span{display:none}.auth{grid-template-columns:1fr}.hero{padding:30px 22px 26px}.ah{margin:20px 0 12px;font-size:30px}.hero .lead{font-size:15px;margin-bottom:18px}.lc.c3,.foot{display:none}.lc{padding:10px 14px 10px 0}.lci{width:44px;height:44px}.boxw{padding:26px 20px 48px}.auth .logo{font-size:32px}.hero .logo{display:block}.auth .box .logo{display:none}.wel{margin-top:0;font-size:28px}
.app{display:block}
nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;background:var(--side);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;overflow-x:auto;gap:2px}
nav .nb{text-align:center;padding:10px 12px;font-size:13px;flex:0 0 auto}nav .nb[aria-current=page]:before{display:none}.logo,.me{display:none}.hero .logo{display:block;font-size:26px}
main{padding:20px 16px 96px}.stat b{font-size:26px;letter-spacing:-.8px}.g6{grid-template-columns:1fr 1fr}.g2,.g2e{grid-template-columns:minmax(0,1fr)}
.welcome{flex-direction:column;align-items:flex-start}.card{padding:14px}.day{min-height:46px;padding:4px}.dial{width:172px;height:172px}.clock{font-size:38px}
.row{flex-wrap:wrap}.g2p,.rgrid{grid-template-columns:minmax(0,1fr)}.side{order:-1}.reader{max-height:72vh}.reader .pv{height:62vh;min-height:300px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#F5F7F8;--card:#fff;--ink:#0B0F12;--mute:#5A6670;--line:#E3E8EB;--brand:#0E7490;--on:#fff;--accent:#06B6D4;--soft:#F0F4F6;--aqua:#D5F5FA;--mint:#A5F3FC;--sky:#E0F2F7;--bad:#C2410C;--ok:#0F766E;--side:#0B0F12;--side2:#0B0F12;--sidetx:#AEB8BE;--dot:transparent;--hero:#F5F7F8;--herotx:#0B0F12;--ringbg:rgba(14,116,144,.14);--ringfg:#0E7490;--wbg:#0B0F12;--wbd:#0B0F12;--wtx:#fff;--fd:Inter,system-ui,sans-serif;--sh:0 1px 2px rgba(11,15,18,.05)}

:root[data-theme="dark"]{--bg:#0B0F12;--card:#12181C;--ink:#F2F5F6;--mute:#9AA6AE;--line:#222B31;--brand:#22D3EE;--on:#06141A;--accent:#22D3EE;--soft:#192127;--aqua:#0E3A44;--mint:#155E75;--sky:#12303A;--bad:#FB923C;--ok:#5EEAD4;--side:#06090B;--side2:#06090B;--sidetx:#9AA6AE;--dot:transparent;--hero:#0B0F12;--herotx:#F2F5F6;--ringbg:rgba(34,211,238,.18);--ringfg:#22D3EE;--wbg:#151D22;--wbd:#222B31;--wtx:#F2F5F6;--sh:none}
.auth{--abg:#F5F7F8;--teal:#0E7490;--tealbtn:#0B0F12;--tealsoft:#E4F7FB;--blue:#0B0F12;--bluesoft:#EBEEF0;--vio:#5A6670;--viosoft:#EBEEF0;--ibg:#fff}
:root[data-theme="dark"] .auth{--abg:#0B0F12;--teal:#22D3EE;--tealbtn:#F2F5F6;--tealsoft:#0E3A44;--blue:#F2F5F6;--bluesoft:#222B31;--vio:#9AA6AE;--viosoft:#222B31;--ibg:#0F151A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .auth{--abg:#0B0F12;--teal:#22D3EE;--tealbtn:#F2F5F6;--tealsoft:#0E3A44;--blue:#F2F5F6;--bluesoft:#222B31;--vio:#9AA6AE;--viosoft:#222B31;--ibg:#0F151A}}
body{background-image:none;font-family:Inter,system-ui,Arial,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
.logo small{font-family:Inter,system-ui,sans-serif}
h1{font-size:28px;font-weight:700;letter-spacing:-.7px}h2{font-size:16px;font-weight:700;letter-spacing:-.1px}
.sub{margin-bottom:22px}
.bl,.ill{display:none}
.hero{background:var(--abg)}
.ah{font-weight:700;letter-spacing:-1.4px}
.lc{border-radius:10px;box-shadow:none;border:1px solid var(--line)}
.lci{border-radius:10px}
.lc .pill{background:var(--tealsoft);color:var(--teal)}
.tabs button{border-radius:8px}
.tabs button[aria-selected=true]{box-shadow:none}
.fld input{border-radius:8px}
.auth .btn.full{border-radius:8px;box-shadow:none}
.auth .btn.ghost.full{border-radius:8px}
nav{background:var(--side);padding:24px 14px}
nav .nb{border-radius:8px;font-weight:500}
nav .nb[aria-current=page]{background:rgba(34,211,238,.12);color:#fff}
nav .nb:hover{background:rgba(255,255,255,.06)}
.me{background:rgba(255,255,255,.06)}
.btn{background:var(--ink);color:var(--bg);border-radius:8px}
.btn:hover:not(:disabled){filter:none;opacity:.86}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--soft);opacity:1;border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad)}
.card{border-radius:12px;box-shadow:var(--sh)}
.welcome{background:var(--wbg);color:var(--wtx);border:1px solid var(--wbd)}
.welcome:after{border-color:rgba(34,211,238,.16)}
:root[data-theme="dark"] .welcome,:root[data-theme="dark"] .welcome h1{color:var(--wtx)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .welcome{background:var(--wbg);color:var(--wtx)}}
:root[data-theme="dark"] .welcome{background:var(--wbg)}
.welcome h1{font-size:26px}
.stat:before{width:3px;background:var(--accent)}
.stat b{color:var(--ink);font-weight:700;letter-spacing:-1px}
.tag{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:600}
.tag.Alta{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-color:transparent}
.prog{background:var(--soft)}
select,input,textarea{border-radius:8px;background:var(--card)}
.day{border-radius:8px}
.day.sel{background:var(--aqua);color:var(--ink);border-color:var(--accent)}
.day.today b{background:var(--ink);color:var(--bg)}
.day.sel.today b{background:var(--ink);color:var(--bg)}
.drop,.drop.over,.drop:hover{border-radius:12px}
.drop{background:var(--card);border:2px dashed var(--accent)}
.drop.over,.drop:hover{background:var(--aqua)}
.drop b{color:var(--ink)}
.badge{border-radius:8px;background:var(--soft);color:var(--ink)}
.dial{background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0)}
.clock{color:var(--ink)}
details{background:var(--soft);border-radius:8px}summary{color:var(--ink)}
.doc h4{color:var(--ink)}
dialog{border-radius:14px;box-shadow:0 24px 60px -24px rgba(0,0,0,.45)}
.toast{background:var(--ink);color:var(--bg)}
.tgf{border-radius:99px}
.tgf:hover{color:var(--ink)}

<script>
const $=id=>document.getElementById(id);
const mem={};
const LS={get(k){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:null},
set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
/* arquivos enviados ficam no IndexedDB (cai para a memória se o navegador bloquear) */
const memFiles={};
const DB={open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('organiza_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}});return this.p},
async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
async put(k,v){try{await this.tx('readwrite',s=>s.put(v,k));delete memFiles[k];return true}catch(e){memFiles[k]=v;return false}},
async get(k){try{const v=await this.tx('readonly',s=>s.get(k));if(v)return v}catch(e){}return memFiles[k]||null},
async del(k){delete memFiles[k];try{await this.tx('readwrite',s=>s.delete(k))}catch(e){}}};

const COLORS=['#0891B2','#475569','#22D3EE','#64748B','#14B8A6','#155E75','#38BDF8','#94A3B8'];
const TIPOS=['Resumo','Material de aula','Lista de exercícios','Anotação','Outro'];
const OK_EXT=['pdf','doc','docx','ppt','pptx','xls','xlsx','txt','md','csv','png','jpg','jpeg','webp','gif'],TEXT_EXT=['txt','md','csv'],MAX=15*1024*1024;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const[y,m,d]=s.split('-');return d+'/'+m};
const fmtSize=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();
const PR={Alta:0,'Média':1,Baixa:2};
const REM={'-1':'Sem lembrete','0':'No dia','1':'1 dia antes','2':'2 dias antes','7':'1 semana antes'};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('org:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return'h:'+(h1>>>0).toString(16)+(h2>>>0).toString(16)}}

let U=null,S=null,view='painel',authTab='login',calM=new Date(),selDay=TODAY;
const F={d:'all',tp:'all',st:'pend',q:''},F2={d:'all',tp:'all',q:''},R={mid:null,out:null,ready:false,tok:0,urls:[]};
const TM={d:'',total:1500,acc:0,t0:0,run:false,mid:null};
const users=()=>LS.get('org_users')||[];
const dkey=()=>'org_d_'+U.email;
const fkey=id=>U.email+':'+id;
const norm=s=>{s=s||{};s.disc=s.disc||[];s.tasks=s.tasks||[];s.mats=s.mats||[];s.ses=s.ses||[];return s};
const save=()=>{if(!LS.set(dkey(),S))toast('Espaço do navegador cheio: alguns dados podem não ser guardados')};
const D=id=>S.disc.find(x=>x.id===id)||{nome:id==null?'Sem disciplina':'(removida)',cor:'#64748B'};
const done=t=>t.status==='done';
const late=t=>!done(t)&&t.date<TODAY;
const sorted=a=>[...a].sort((x,y)=>x.date.localeCompare(y.date)||PR[x.prio]-PR[y.prio]);
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const logo=()=>`<div class="logo">Organiza<b>+</b><small>Rotina Acadêmica</small></div>`;

const T1=`Qualidade de software é o grau em que um sistema atende às necessidades de quem o usa. A norma ISO/IEC 25010 organiza a qualidade em características como adequação funcional, eficiência de desempenho, usabilidade, confiabilidade, segurança e manutenibilidade. Testes de software servem para encontrar defeitos antes que o sistema chegue ao usuário. A qualidade do software deve ser planejada desde os requisitos, e não apenas verificada no fim do projeto. Revisões de código ajudam a detectar defeitos cedo e a compartilhar conhecimento na equipe. A manutenibilidade indica quanto custa corrigir e evoluir o software depois da entrega.`;
const T2=`O modelo entidade-relacionamento representa os dados por meio de entidades, atributos e relacionamentos. A chave primária identifica cada registro de uma tabela de forma única. A chave estrangeira liga uma tabela a outra e mantém a integridade dos dados. A normalização organiza as tabelas para reduzir a redundância de dados. A cardinalidade de um relacionamento indica quantos registros de uma entidade se ligam aos registros de outra.`;
const T3=`O limite de uma função descreve o valor do qual f(x) se aproxima quando x se aproxima de um ponto. Uma função é contínua em um ponto quando o limite existe e é igual ao valor da função nesse ponto. Os limites laterais analisam a aproximação pela esquerda e pela direita do ponto. Quando os limites laterais são diferentes, o limite da função nesse ponto não existe. Limites no infinito mostram o comportamento da função quando x cresce ou decresce sem parar.`;
const DEMO_V=3;
const NT={
sql:`O comando SELECT consulta dados de uma ou mais tabelas e pode ser combinado com WHERE para filtrar linhas. O INNER JOIN devolve apenas os registros que têm correspondência nas duas tabelas. O LEFT JOIN mantém todos os registros da tabela da esquerda, mesmo sem correspondência. A cláusula GROUP BY agrupa linhas para que funções como COUNT, SUM e AVG sejam calculadas por grupo. A cláusula HAVING filtra os grupos depois da agregação, enquanto o WHERE filtra as linhas antes dela. Uma subconsulta é uma consulta dentro de outra e pode ser usada no WHERE ou no FROM.`,
norm:`A primeira forma normal exige que cada coluna guarde um único valor atômico e que não existam grupos repetidos. A segunda forma normal exige a primeira e remove dependências parciais, em que um atributo depende de apenas parte da chave primária. A terceira forma normal exige a segunda e remove dependências transitivas entre atributos não chave. A normalização reduz a redundância e evita anomalias de inserção, atualização e exclusão. Em alguns casos de consulta pesada, a desnormalização controlada pode melhorar o desempenho, mas aumenta o risco de inconsistência.`,
deriv:`A derivada de uma função mede a taxa de variação instantânea dessa função em relação à variável. Geometricamente, a derivada em um ponto é o coeficiente angular da reta tangente ao gráfico nesse ponto. A regra do produto diz que a derivada de f vezes g é f linha vezes g mais f vezes g linha. A regra da cadeia deriva funções compostas multiplicando a derivada da função externa pela derivada da função interna. Os pontos em que a derivada se anula são candidatos a máximos e mínimos locais da função. A segunda derivada ajuda a decidir a concavidade e a classificar esses pontos.`,
rec:`Uma função recursiva resolve um problema chamando a si mesma com uma versão menor da entrada. Toda recursão precisa de um caso base, que encerra as chamadas, e de um caso recursivo, que se aproxima do caso base. Sem caso base, a recursão não termina e o programa estoura a pilha de chamadas. O cálculo do fatorial e da sequência de Fibonacci são exemplos clássicos de recursividade. Muitos problemas recursivos podem ser reescritos com laços, o que costuma gastar menos memória. A busca binária em uma lista ordenada pode ser escrita de forma recursiva e reduz o problema pela metade a cada chamada.`,
us:`Uma história de usuário descreve uma necessidade na forma: como um tipo de usuário, eu quero uma funcionalidade, para obter um benefício. Boas histórias seguem o critério INVEST: independentes, negociáveis, valiosas, estimáveis, pequenas e testáveis. Os critérios de aceitação indicam quando a história pode ser considerada pronta. Histórias muito grandes, chamadas de épicos, devem ser divididas antes de entrar em uma sprint. O backlog do produto reúne as histórias ordenadas por prioridade, e o dono do produto é quem decide essa ordem.`,
uc:`Um caso de uso descreve a interação entre um ator e o sistema para atingir um objetivo. O fluxo principal mostra o caminho em que tudo dá certo, e os fluxos alternativos mostram variações e erros. As pré-condições indicam o que precisa ser verdade antes do caso começar, e as pós-condições indicam o estado do sistema ao final. O diagrama de casos de uso mostra atores, casos de uso e os relacionamentos de inclusão e extensão entre eles. Requisitos funcionais descrevem o que o sistema faz, enquanto requisitos não funcionais descrevem qualidades como desempenho, segurança e usabilidade.`,
test:`A pirâmide de testes sugere muitos testes de unidade na base, alguns testes de integração no meio e poucos testes de ponta a ponta no topo. Testes de unidade verificam pequenas partes do código de forma isolada e rodam rápido. Testes de integração verificam se módulos funcionam bem juntos, por exemplo a aplicação e o banco de dados. A cobertura de testes indica quanto do código é executado pelos testes, mas cobertura alta não garante ausência de defeitos. Testes de regressão garantem que uma correção não quebrou algo que já funcionava. Revisões de código e inspeções também encontram defeitos cedo, com custo menor que corrigi-los em produção.`,
scrum:`O Scrum organiza o trabalho em sprints, ciclos curtos de uma a quatro semanas. A sprint começa com o planejamento, em que o time escolhe os itens do backlog que cabem no ciclo. Durante a sprint ocorre a reunião diária, de cerca de quinze minutos, para alinhar o andamento e levantar impedimentos. Ao final há a revisão da sprint, que mostra o incremento pronto, e a retrospectiva, que discute como melhorar o processo. Os papéis do Scrum são o dono do produto, o Scrum Master e o time de desenvolvimento. O quadro de tarefas ajuda a visualizar o que está a fazer, em andamento e concluído.`,
eng:`Technical English for software focuses on vocabulary used in daily work. A bug is a defect in the code, and to debug means to find and fix it. A requirement is something the system must do, and a deadline is the date when work must be delivered. The words feature, release and update describe how a product evolves over time. In emails, short and polite sentences work best, for example: could you please review my pull request by Friday. In reading, look first for the title, the headings and the key terms before reading every sentence.`,
cmd:`O ciclo de vida de requisitos inclui elicitação, análise, especificação, validação e gerenciamento. A elicitação usa entrevistas, questionários, observação e prototipação para descobrir o que os usuários precisam. Requisitos ambíguos geram retrabalho, por isso cada requisito deve ser claro, verificável e rastreável. A matriz de rastreabilidade liga requisitos a casos de teste e a partes do sistema. Mudanças de requisitos são normais e devem passar por um processo de controle para avaliar impacto em prazo e custo.`,
vis:`O documento de visão resume o problema, o público, os objetivos e o escopo do produto em poucas páginas. Ele deve responder quem usa o sistema, qual dor ele resolve e como o sucesso será medido. Também registra o que está fora do escopo, para evitar expectativas erradas. Uma boa visão é curta, concreta e compreendida por toda a equipe, inclusive por quem não é técnico. Ela serve de referência para decidir quais funcionalidades entram primeiro no produto.`
};
const NF={
bd:`ROTEIRO DE REVISÃO - PROVA P1 DE BANCO DE DADOS\n\n1. Modelo entidade-relacionamento: entidades, atributos, relacionamentos e cardinalidade.\n2. Chaves primária, estrangeira e candidata. A chave primária identifica cada registro de forma única.\n3. Modelo lógico: como transformar o diagrama em tabelas.\n4. SQL básico: SELECT, WHERE, ORDER BY, INSERT, UPDATE e DELETE.\n5. Junções: INNER JOIN e LEFT JOIN com exemplos de duas tabelas.\n6. Funções de agregação: COUNT, SUM, AVG, MIN e MAX com GROUP BY.\n\nDica da professora: refazer as listas 1 a 3 sem consultar as respostas. A prova terá duas questões de modelagem e três de SQL. Treinar a leitura do enunciado ajuda a não esquecer relacionamentos.`,
req:`MATERIAL DE AULA - ENGENHARIA DE REQUISITOS\n\nAula 5: técnicas de elicitação. Entrevistas permitem aprofundar as necessidades, mas dependem da habilidade do entrevistador. Questionários alcançam muitas pessoas com pouco custo. A observação mostra como o trabalho acontece de verdade, e não apenas como as pessoas dizem que acontece. A prototipação ajuda o usuário a reagir a algo concreto.\n\nExercício da aula: escolher duas técnicas para levantar requisitos de um sistema de biblioteca escolar e justificar a escolha. Entregar em uma página.`,

if(nome.length<3)return err('Informe seu nome completo.');

if(users().some(u=>u.email===email))return err('Este e-mail já tem conta. Use a aba Entrar.');
const u={email,nome,curso:$('a-curso').value.trim(),sem:$('a-sem').value,h:await hash(senha)};
LS.set('org_users',[...users(),u]);LS.set('org_d_'+email,norm({}));login(u)}

const clock=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x)};
const tmEl=()=>Math.floor(TM.acc+(TM.run?(Date.now()-TM.t0)/1000:0));
const dialP=()=>TM.total?Math.min(100,tmEl()/TM.total*100).toFixed(1):((tmEl()%3600)/36).toFixed(1);
const tmShow=()=>TM.total?Math.max(0,TM.total-tmEl()):tmEl();
const tmIdle=()=>!TM.run&&TM.acc===0;
function tmReset(){TM.run=false;TM.acc=0;TM.mid=null}
function tmStart(){if(TM.run)return;
if(tmIdle()){TM.mid=(view==='estudar'&&R.mid)||null;const m=TM.mid&&S.mats.find(x=>x.id===TM.mid);if(m)TM.d=m.d==null?'':String(m.d)}
TM.t0=Date.now();TM.run=true;drawTimer()}
function tmPause(){if(!TM.run)return;TM.acc=tmEl();TM.run=false;drawTimer()}
function tmEnd(){if(!U)return;const el=TM.total&&tmEl()>=TM.total?TM.total:tmEl();const mid=TM.mid;TM.run=false;TM.acc=0;TM.mid=null;
const min=Math.max(1,Math.round(el/60));
if(el<15){toast('Menos de 15 segundos: sessão não salva');afterTimer();return}
S.ses.push({id:Date.now(),d:TM.d?+TM.d:null,min,date:TODAY,mid:mid||null});save();afterTimer();toast(`Sessão salva: ${min} min`)}
function afterTimer(){if(view==='painel'){render();return}drawTimer();drawWeek()}
setInterval(()=>{if(TM.run&&TM.total&&tmEl()>=TM.total){tmEnd();return}const e=$('tm');if(e){e.textContent=clock(tmShow());const dl=$('dial');if(dl)dl.style.setProperty('--p',dialP())}},250);
const matMin=id=>S.ses.filter(s=>s.mid===id).reduce((a,s)=>a+s.min,0);

<div class="dial" id="dial" style="--p:${dialP()}"><div class="clock" id="tm" role="timer">${clock(tmShow())}</div></div>
<div class="btns">${TM.run?'<button class="btn" data-act="tmPause">Pausar</button>':`<button class="btn" data-act="tmStart">${idle?'Iniciar':'Continuar'}</button>`}<button class="btn ghost" data-act="tmEnd" ${idle?'disabled':''}>Encerrar e salvar</button></div>

const STOP=new Set('a o as os um uma uns umas de do da dos das em no na nos nas por para com sem sob sobre entre e ou mas que se como mais menos muito muita já também é são foi ser está estão pode podem deve devem quando onde qual quais este esta estes estas isso isto esse essa esses essas ao aos à às pelo pela pelos pelas seu sua seus suas ele ela eles elas nós você vocês há ter tem têm tendo então assim porque cada outro outra outros outras mesmo mesma só até depois antes durante pois'.split(' '));
const wordsOf=s=>(s.toLowerCase().match(/[a-zà-úç0-9]+/g)||[]);
function analyze(text){
const sents=(text.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+/g)||[]).map(s=>s.trim()).filter(s=>s.length>25);
if(sents.length<3)return{short:true};
const freq={};sents.forEach(s=>wordsOf(s).forEach(w=>{if(w.length>3&&!STOP.has(w))freq[w]=(freq[w]||0)+1}));
const score=s=>{const w=wordsOf(s).filter(x=>x.length>3&&!STOP.has(x));return w.length?w.reduce((a,x)=>a+(freq[x]||0),0)/Math.sqrt(w.length):0};
const ranked=sents.map((s,i)=>({s,i,sc:score(s)})).sort((a,b)=>b.sc-a.sc);
const sum=ranked.slice(0,3).sort((a,b)=>a.i-b.i).map(x=>x.s);
const terms=Object.entries(freq).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).slice(0,8).map(x=>x[0]);
const qs=ranked.slice(0,5).sort((a,b)=>a.i-b.i).map(({s})=>{
const ws=wordsOf(s).filter(x=>x.length>4&&!STOP.has(x));if(!ws.length)return null;
const key=ws.sort((a,b)=>(freq[b]||0)-(freq[a]||0)||b.length-a.length)[0];
const re=new RegExp('(^|[^a-zà-úç0-9])('+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![a-zà-úç0-9])','i');
if(!re.test(s))return null;return{q:s.replace(re,(m,p)=>p+'_____'),a:key}}).filter(Boolean);
return{sum,terms,qs}}

/* leitor de documentos: imagem, texto, PDF (pdf.js), Word/PowerPoint/Excel (texto) */
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/';
let pdfP=null;
const getPdfjs=()=>pdfP||(pdfP=import(PDFJS+'pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.mjs';return m}).catch(e=>{pdfP=null;throw e}));
async function pdfText(doc){let out='';const n=Math.min(doc.numPages,40);for(let i=1;i<=n&&out.length<20000;i++){const p=await doc.getPage(i),c=await p.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n'}return out.replace(/[ \t]+/g,' ').trim().slice(0,20000)}
async function showPdf(host,blob,m,bag){

let lib;try{lib=await getPdfjs()}catch(e){return iframe('Leitor de PDF indisponível (sem internet). Exibindo o visualizador do navegador; a revisão automática precisa de internet para ler o texto do PDF. Se não aparecer, use Baixar.')}
try{
const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
host.innerHTML='<div class="pages"></div>';const box=host.firstChild;
const W=Math.max(260,Math.min((host.clientWidth||700)-30,900)),p1=await doc.getPage(1),v1=p1.getViewport({scale:1}),sc=W/v1.width,dpr=Math.min(window.devicePixelRatio||1,2);
const draw=async(i,c)=>{const p=await doc.getPage(i),vp=p.getViewport({scale:sc*dpr});c.width=vp.width;c.height=vp.height;c.style.width=Math.round(vp.width/dpr)+'px';c.style.height=Math.round(vp.height/dpr)+'px';await p.render({canvasContext:c.getContext('2d'),canvas:c,viewport:vp}).promise};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done='1';draw(+e.target.dataset.p,e.target).catch(()=>{})}}),{rootMargin:'700px'});
for(let i=1;i<=doc.numPages;i++){const c=document.createElement('canvas');c.className='pg';c.dataset.p=i;c.style.width=W+'px';c.style.height=Math.round(v1.height*sc)+'px';c.setAttribute('aria-label','Página '+i+' de '+doc.numPages);box.appendChild(c);io.observe(c)}
return await pdfText(doc).catch(()=>'')
}catch(e){return iframe('Não foi possível desenhar este PDF no leitor. Exibindo o visualizador do navegador. Se não aparecer, use Baixar.')}}
async function zipSections(blob,ext){
if(typeof JSZip==='undefined')throw new Error('leitor indisponível');
const z=await JSZip.loadAsync(blob),dec=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const paras=(xml,tag)=>xml.split('</'+tag+':p>').map(p=>dec((p.match(/<(?:w|a):t(?: [^>]*)?>[^<]*<\/(?:w|a):t>|<w:tab\/>/g)||[]).map(t=>t.startsWith('<w:tab')?'\t':t.replace(/<[^>]+>/g,'')).join(''))).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
if(ext==='docx'){const f=z.file('word/document.xml');if(!f)throw new Error('arquivo inválido');return[{h:'',p:paras(await f.async('string'),'w')}]}
if(ext==='pptx'){const ns=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/slide(\d+)/)[1])-(+b.match(/slide(\d+)/)[1]));
const out=[];for(const n of ns)out.push({h:'Slide '+n.match(/slide(\d+)/)[1],p:paras(await z.file(n).async('string'),'a')});return out}
let xs=[];for(const n of Object.keys(z.files).filter(n=>/^xl\/(sharedStrings|worksheets\/sheet\d+)\.xml$/.test(n))){const x=await z.file(n).async('string'),src=n.includes('sharedStrings')?x:(x.match(/<is>[\s\S]*?<\/is>/g)||[]).join('');xs=xs.concat(src.match(/<t(?: [^>]*)?>[^<]*<\/t>/g)||[])}
return[{h:'Textos da planilha',p:xs.map(t=>dec(t.replace(/<[^>]+>/g,'')).trim()).filter(Boolean).slice(0,400)}]}
async function docInto(host,m,blob,bag){
const ext=extOf(m.fname||''),mime=m.mime||'';
if(m.tipo==='Anotação'){host.innerHTML=`<pre class="pre" style="margin:0">${esc(m.texto||'')}</pre>`;return m.texto||''}
if(!blob){host.innerHTML='<p class="empty">Arquivo não encontrado neste navegador. Ele pode ter sido guardado só até fechar a página. Envie o arquivo de novo.</p>';return m.texto||''}
try{
if(mime.startsWith('image/')||['png','jpg','jpeg','webp','gif'].includes(ext)){const u=URL.createObjectURL(blob);bag.push(u);host.innerHTML=`<img class="pv" src="${u}" alt="${esc(m.nome)}">`;return ''}
if(TEXT_EXT.includes(ext)){const t=await blob.text();host.innerHTML=`<pre class="pre" style="margin:0">${esc(t.slice(0,60000))}</pre>`;return t.slice(0,20000)}
if(ext==='pdf'||mime==='application/pdf')return await showPdf(host,blob,m,bag);
if(['docx','pptx','xlsx'].includes(ext)){const secs=await zipSections(blob,ext),n=secs.reduce((a,x)=>a+x.p.length,0);
if(!n){host.innerHTML='<p class="empty">Nenhum texto encontrado neste arquivo (ele pode ter só imagens). Use Baixar para abrir no seu computador.</p>';return ''}
host.innerHTML='<div class="doc">'+secs.map(x=>(x.h?`<h4>${esc(x.h)}</h4>`:'')+x.p.map(t=>`<p>${esc(t)}</p>`).join('')).join('')+'<p class="note">Visualização simplificada, só com o texto. Use Baixar para ver o arquivo completo.</p></div>';
return secs.map(x=>x.p.map(t=>/[.!?:;]$/.test(t)?t:t+'.').join(' ')).join(' ').slice(0,20000)}
host.innerHTML=`<p class="empty">Este formato (.${esc(ext||'?')}) não pode ser exibido aqui. Use Baixar para abrir no seu computador. Para estudar na plataforma, prefira PDF, DOCX ou PPTX.</p>`;return ''
}catch(e){host.innerHTML=`<p class="empty">Não foi possível abrir este arquivo (${esc(e&&e.message||'erro')}). Ele pode estar protegido ou corrompido. Use Baixar.</p>`;return ''}}
async function openMat(id){const m=S.mats.find(x=>x.id===id);if(!m)return;
form.innerHTML=`<h2>${esc(m.nome)}</h2><small style="color:var(--mute)">${esc(D(m.d).nome)} · ${m.tipo} · ${fmtSize(m.tam||0)}</small>
<div class="card reader" id="dv" style="margin-top:10px;max-height:60vh"><p class="empty">Abrindo…</p></div>
<div class="acts"><button class="btn ghost" type="button" data-dl="${m.id}">Baixar</button><button class="btn ghost" type="button" data-studym="${m.id}">Estudar</button><button class="btn" value="cancel">Fechar</button></div>`;
form.onsubmit=null;const bag=[];dlg.addEventListener('close',()=>bag.forEach(u=>URL.revokeObjectURL(u)),{once:true});show(true);
const host=$('dv'),blob=await getBlob(m),txt=await docInto(host,m,blob,bag);if(txt&&!m.texto){m.texto=txt;save()}}
async function dl(id){const m=S.mats.find(x=>x.id===id);if(!m)return;
let blob=await getBlob(m);if(!blob)blob=new Blob([m.texto||''],{type:'text/plain;charset=utf-8'});
const name=m.fname||(m.nome.replace(/[\\\/:*?"<>|]+/g,'').trim()||'anotacao')+'.txt';
let svc=null;try{svc=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
if(svc){try{await svc.save({filename:name,data:blob});toast('Arquivo salvo')}catch(e){toast(e&&e.code==='declined'?'Download cancelado':e&&e.code==='rejected_extension'?'Este tipo de arquivo não pode ser baixado pela página publicada. Use o arquivo .html do protótipo.':'Não foi possível baixar agora')}return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Download iniciado')}
function studyMat(id){const m=S.mats.find(x=>x.id===id);if(!m)return;if(dlg.open)dlg.close();if(!tmIdle()&&TM.mid!==id)tmEnd();view='estudar';R.mid=id;R.out=null;render()}

/* ---------- dados e integrações: backup, calendário (.ics), notificações ---------- */
async function saveFile(blob,name){
let svc=null;try{svc=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
if(svc){try{await svc.save({filename:name,data:blob});toast('Arquivo salvo')}catch(e){toast(e&&e.code==='declined'?'Download cancelado':e&&e.code==='rejected_extension'?'Este tipo de arquivo não pode ser baixado pela página publicada. Use o arquivo .html do protótipo.':'Não foi possível baixar agora')}return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Download iniciado')}
const toB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
const fromB64=(x,type)=>{const bin=atob(x),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||'application/octet-stream'})};
async function expBackup(){
toast('Preparando o backup...');
const mats=[];for(const m of S.mats){const o={...m};if(m.fname){const b=await getBlob(m);if(b){o._b64=await toB64(b);o._type=b.type||m.mime||''}}mats.push(o)}
const data={app:'organiza-mais',v:1,em:TODAY,disc:S.disc,tasks:S.tasks,ses:S.ses,mats};
await saveFile(new Blob([JSON.stringify(data)],{type:'application/json'}),'backup-organiza-mais-'+TODAY+'.json')}
async function impBackup(file){
let d;try{d=JSON.parse(await file.text())}catch(e){toast('Arquivo inválido: não é um backup do Organiza+');return}
if(!d||d.app!=='organiza-mais'||!Array.isArray(d.disc)||!Array.isArray(d.tasks)||!Array.isArray(d.mats)){toast('Este arquivo não é um backup do Organiza+');return}
form.innerHTML=`<h2>Restaurar backup</h2><p class="note">O backup tem ${d.disc.length} disciplina${d.disc.length===1?'':'s'}, ${d.tasks.length} atividade${d.tasks.length===1?'':'s'} e ${d.mats.length} ${d.mats.length===1?'material':'materiais'}. Ao restaurar, os dados atuais desta conta são substituídos.</p><div class="acts"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Substituir meus dados</button></div>`;
form.onsubmit=async e=>{if(!e.submitter||e.submitter.value!=='ok')return;
for(const m of S.mats.filter(x=>x.fname))await DB.del(fkey(m.id));
const mats=[];for(const m of d.mats){const o={...m};const b=o._b64,ty=o._type;delete o._b64;delete o._type;if(o.fname){if(b)await DB.put(fkey(o.id),fromB64(b,ty));else{o.fname=null}}mats.push(o)}
S=norm({disc:d.disc,tasks:d.tasks,ses:d.ses||[],mats});save();tmReset();R.mid=null;R.out=null;F.d='all';F2.d='all';view='painel';render();toast('Backup restaurado')};
show()}
function expIcs(){
if(!S.tasks.length){toast('Não há atividades para exportar');return}
const e2=x=>String(x).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const nx=s=>{const[y,m,d]=s.split('-').map(Number),t=new Date(y,m-1,d+1);return iso(t).replace(/-/g,'')};
const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Organiza+ Rotina Academica//PT-BR','CALSCALE:GREGORIAN'];
for(const t of S.tasks){L.push('BEGIN:VEVENT','UID:org-'+t.id+'@organiza.app','DTSTAMP:'+TODAY.replace(/-/g,'')+'T000000Z','DTSTART;VALUE=DATE:'+t.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+nx(t.date),'SUMMARY:'+e2(t.tipo+': '+t.t+' ('+D(t.d).nome+')'),'DESCRIPTION:'+e2((t.nota||'')+(done(t)?' [concluída]':'')),'END:VEVENT')}
L.push('END:VCALENDAR');saveFile(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'atividades-organiza-mais.ics')}
function parseIcs(txt){
const lines=txt.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n');const ev=[];let c=null;
const un=v=>String(v||'').replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
for(const ln of lines){if(/^BEGIN:VEVENT/i.test(ln)){c={}}else if(/^END:VEVENT/i.test(ln)){if(c&&c.t&&c.date)ev.push(c);c=null}
else if(c){const i=ln.indexOf(':');if(i<0)continue;const k=ln.slice(0,i).split(';')[0].toUpperCase(),v=ln.slice(i+1);
if(k==='SUMMARY')c.t=un(v);else if(k==='DESCRIPTION')c.nota=un(v);else if(k==='DTSTART'){const m=v.match(/^(\d{4})(\d{2})(\d{2})/);if(m)c.date=`${m[1]}-${m[2]}-${m[3]}`}}}
return ev.slice(0,300)}
const guessIcsTipo=t=>/prova|avalia|p[1-3]\b|exame/i.test(t)?'Prova':/trabalho|projeto|semin[aá]rio|entrega/i.test(t)?'Trabalho':'Tarefa';
async function impIcs(file){
if(!S.disc.length){toast('Cadastre uma disciplina primeiro para receber os eventos');view='disciplinas';render();return}
let ev;try{ev=parseIcs(await file.text())}catch(e){ev=[]}
const have=new Set(S.tasks.map(t=>t.t+'|'+t.date));ev=ev.filter(x=>!have.has(x.t.slice(0,80)+'|'+x.date));
if(!ev.length){toast('Nenhum evento novo encontrado nesse arquivo de calendário');return}
form.innerHTML=`<h2>Importar calendário</h2><p class="note">${ev.length} evento${ev.length>1?'s':''} novo${ev.length>1?'s':''} encontrado${ev.length>1?'s':''}. Eles entram como atividades pendentes na disciplina escolhida e você pode editar depois.</p><label for="ic-d">Disciplina</label><select id="ic-d">${S.disc.map(d=>`<option value="${d.id}">${esc(d.nome)}</option>`).join('')}</select><div class="acts"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Importar ${ev.length}</button></div>`;
form.onsubmit=e=>{if(!e.submitter||e.submitter.value!=='ok')return;const d=+$('ic-d').value;
ev.forEach((x,i)=>S.tasks.push({id:Date.now()+i,t:x.t.slice(0,80),d,tipo:guessIcsTipo(x.t),date:x.date,prio:'Média',status:'pend',rem:1,nota:(x.nota||'').slice(0,300),doneAt:null}));
save();render();toast(ev.length+' atividade'+(ev.length>1?'s importadas':' importada'))};
show()}
const NK=()=>'org_notif_'+(U?U.email:'');
const notifOk=()=>{try{return 'Notification' in window&&Notification.permission==='granted'&&!!LS.get(NK())}catch(e){return false}};
async function toggleNotif(){
try{if(!('Notification' in window)){toast('Este navegador não oferece notificações');return}
if(LS.get(NK())){LS.set(NK(),false);render();toast('Notificações desativadas');return}
let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
if(p!=='granted'){toast('O navegador não permitiu notificações. Libere nas configurações do site e tente de novo.');return}
LS.set(NK(),true);LS.del('org_nlast_'+U.email);render();toast('Notificações ativadas');checkNotif()}catch(e){toast('Não foi possível ativar as notificações neste navegador')}}
function checkNotif(){
if(!U||!S||!notifOk())return;const lk='org_nlast_'+U.email;if(LS.get(lk)===TODAY)return;
const l=sorted(S.tasks.filter(t=>!done(t)&&(late(t)||(+t.rem>=0&&t.date<=plus(+t.rem)))));if(!l.length)return;
try{new Notification('Organiza+ Rotina Acadêmica',{body:l.length+(l.length>1?' atividades pedem':' atividade pede')+' atenção: '+l.slice(0,3).map(t=>t.t).join('; ')+(l.length>3?'...':'')});LS.set(lk,TODAY)}catch(e){}}
setInterval(checkNotif,60000);
function integ(){const on=notifOk(),sup='Notification' in window;
return`<div class="card" style="max-width:520px;margin-top:16px"><h2>Dados e integrações</h2>
<p class="note">Suas informações ficam guardadas só neste navegador. Faça um backup para ter uma cópia ou levar seus dados e arquivos para outro computador.</p>
<div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost" data-act="expBackup">Exportar backup</button><button class="btn ghost" data-act="impBackup">Restaurar backup</button></div>
<p class="note" style="margin-top:14px">Calendário: leve suas atividades para o Google Agenda ou outro aplicativo (arquivo .ics) ou traga os prazos de lá para cá.</p>
<div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost" data-act="expIcs">Exportar atividades (.ics)</button><button class="btn ghost" data-act="impIcs">Importar calendário (.ics)</button></div>
<p class="note" style="margin-top:14px">Lembretes no navegador: ${on?'ativados. Você recebe um aviso por dia, enquanto o Organiza+ estiver aberto em alguma aba.':sup?'desativados. Ative para receber um aviso das atividades que pedem atenção, enquanto o Organiza+ estiver aberto em alguma aba.':'este navegador não oferece notificações.'}</p>
${sup?`<div class="acts" style="justify-content:flex-start"><button class="btn ${on?'ghost':''}" data-act="notif">${on?'Desativar lembretes':'Ativar lembretes'}</button></div>`:''}
<input type="file" id="bkin" accept=".json,application/json" hidden><input type="file" id="icsin" accept=".ics,text/calendar" hidden></div>`}

/* ---------- eventos ---------- */

else if(d.v){if(d.v==='estudar')R.mid=null;view=d.v;render()}

else if(d.act==='demo')demo();

else if(d.act==='impBackup')$('bkin').click();

else if(d.act==='theme'){LS.set('org_theme',effDark()?'light':'dark');applyTheme();document.querySelectorAll('[data-act=theme]').forEach(x=>{x.innerHTML=(effDark()?THI.sun:THI.moon)+'<span>'+(effDark()?'Modo claro':'Modo escuro')+'</span>';x.setAttribute('aria-label',effDark()?'Mudar para o modo claro':'Mudar para o modo escuro')});const ps=$('p-th');if(ps)ps.value=LS.get('org_theme')}
else if(d.act==='saveProfile'){const us=users().map(u=>u.email===U.email?{...u,nome:$('p-nome').value.trim()||u.nome,curso:$('p-curso').value.trim(),sem:$('p-sem').value}:u);
LS.set('org_users',us);U=us.find(u=>u.email===U.email);const th=$('p-th').value;LS.set('org_theme',th);applyTheme();render();toast('Perfil salvo')}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='bkin'){const f=t.files[0];t.value='';if(f)impBackup(f)}
else if(t.id==='icsin'){const f=t.files[0];t.value='';if(f)impIcs(f)}
else if(t.id==='fin'){const l=Array.from(t.files);t.value='';upFlow(l)}
else if(t.classList.contains('chk')){const k=S.tasks.find(x=>x.id==t.dataset.id);k.status=t.checked?'done':'pend';k.doneAt=t.checked?TODAY:null;save();render();toast(t.checked?'Atividade concluída':'Atividade reaberta')}
else if(t.id==='fd'){F.d=t.value;render()}else if(t.id==='ftp'){F.tp=t.value;render()}else if(t.id==='fs'){F.st=t.value;render()}
else if(t.id==='md'){F2.d=t.value;render()}else if(t.id==='mt'){F2.tp=t.value;render()}
else if(t.id==='tm-d'){TM.d=t.value}
else if(t.id==='tm-dur'){TM.total=+t.value;TM.acc=0;drawTimer()}});
let noteT=null;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='rm-notes'){const m=S.mats.find(x=>x.id===R.mid);if(m){m.estudo=t.value;clearTimeout(noteT);noteT=setTimeout(save,500)}return}if(t.id!=='fq'&&t.id!=='mq')return;(t.id==='fq'?F:F2).q=t.value;const pos=t.selectionStart;render();const n=$(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over')}});

let themeOwned=false;
function applyTheme(){const th=LS.get('org_theme');const r=document.documentElement;if(th==='light'||th==='dark'){r.setAttribute('data-theme',th);themeOwned=true}else if(themeOwned){r.removeAttribute('data-theme');themeOwned=false}}
const effDark=()=>{const a=document.documentElement.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const THI={moon:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500Z"/></svg>`,sun:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.500M12 19v2.500M2.500 12H5M19 12h2.500M5.200 5.200 7 7M17 17l1.800 1.800M5.200 18.800 7 17M17 7l1.800-1.800"/></svg>`};

applyTheme();
const sess=LS.get('org_sess'),su=sess&&users().find(u=>u.email===sess);
if(su){U=su;S=norm(LS.get(dkey()))}
render();setTimeout(checkNotif,1500);
